:root{--ink:#26364b;--muted:#748299;--line:#dbe2ec;--blue:#3674ed;--bg:#f5f7fb;--panel:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer}.top{height:44px;display:flex;align-items:center;gap:25px;padding:0 17px;background:white;border-bottom:1px solid var(--line)}.top button,.headbtn{border:0;background:none;padding:5px}.brand{margin-left:auto;color:var(--muted);font-size:12px}.bar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:7px}.bar button{height:40px;min-width:40px;background:white;border:1px solid transparent;border-radius:10px;font-size:18px}.bar button:hover,.bar button.active{background:#e9f0ff;color:var(--blue);border-color:#d5e2ff}.sep{height:30px;border-left:1px solid var(--line);margin:0 6px}.bar .right{margin-left:auto}.layout{height:calc(100vh - 106px);display:grid;grid-template-columns:250px 1fr 310px;min-height:460px}.side{background:white;overflow:auto;border-right:1px solid var(--line)}.rightside{border-right:0;border-left:1px solid var(--line)}.sidehead{height:50px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #edf0f4}.objects{padding:9px}.obj{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:8px}.obj:hover{background:#f2f5fa}.obj .sym{width:22px;text-align:center;color:var(--blue);font-weight:700}.obj small{color:var(--muted);margin-left:auto}.algebra{padding:12px}.algebra input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#f9fafc;outline:none}.algebra input:focus{border-color:#92b2ff}.stage{position:relative;background:white;overflow:hidden;touch-action:none}.stage svg{width:100%;height:100%;display:block;cursor:crosshair}.axes{stroke:#596274;stroke-width:1.15;vector-effect:non-scaling-stroke}.gridline{stroke:#e7ebf1;stroke-width:.7;vector-effect:non-scaling-stroke}.major{stroke:#d7dde6}.ticktext{fill:#4a5362;font:12px system-ui}.pt{fill:#3674ed;stroke:white;stroke-width:2;vector-effect:non-scaling-stroke}.construction{fill:none;stroke:#386fd4;stroke-width:2;vector-effect:non-scaling-stroke}.graph{fill:none;stroke:#e45169;stroke-width:2.4;vector-effect:non-scaling-stroke}.label{fill:#26364b;font:13px system-ui;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.panel{margin:10px;border:1px solid var(--line);border-radius:11px;overflow:hidden}.sect{padding:10px 11px;font-size:12px;font-weight:800;letter-spacing:.03em;background:#f5f7fa;display:flex;justify-content:space-between;cursor:pointer}.tools{padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tool{height:43px;background:#fff;border:1px solid #dce4ef;border-radius:9px;color:#455874;font-size:17px}.tool:hover{background:#f4f7ff;border-color:#9cb8f7;color:var(--blue)}.tool.active{background:#e8f0ff;border-color:#7aa1ff;color:var(--blue)}.hint{position:absolute;left:14px;bottom:13px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#ffffffed;color:#657187;font-size:12px;pointer-events:none}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#23334b;color:white;border-radius:8px;padding:9px 14px;display:none}.empty{color:#919bab;padding:12px 7px;font-size:12px}.modal{position:fixed;inset:0;background:#17243a66;display:none;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.dialog{width:min(520px,92vw);background:white;border-radius:14px;padding:20px;box-shadow:0 20px 70px #19294244}.dialog h2{margin:0 0 14px}.dialog input{width:100%;border:1px solid var(--line);padding:12px;border-radius:8px}.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.primary{background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 14px}.plain{background:white;border:1px solid var(--line);border-radius:8px;padding:10px 14px}.mobiletoggle{display:none}@media(max-width:900px){.layout{grid-template-columns:210px 1fr}.rightside{display:none}.rightside.open{display:block;position:absolute;right:0;top:106px;bottom:0;width:310px;z-index:3;box-shadow:-8px 0 28px #22334b22}.mobiletoggle{display:block}.algebra{display:none}}@media(max-width:600px){.layout{grid-template-columns:1fr}.side{display:none}.bar{gap:2px;padding:0 6px}.bar button{min-width:35px}.top{gap:13px}}
</style></head><body>
<nav class="top"><button>Fichier</button><button>Édition</button><button>Affichage</button><button>Macros</button><button>Outils</button><span class="brand">GeoMaths · Monsieur Zeghoudi</span></nav>
<div class="bar"><button title="Ouvrir une figure" onclick="document.getElementById('loadfile').click()">📂</button><button title="Enregistrer la figure" onclick="saveFile()">💾</button><button title="Effacer la figure" onclick="clearFigure()">⌫</button><span class="sep"></span><button id="axisBtn" class="active" title="Afficher les axes" onclick="toggleAxes()">⌖</button><button id="gridBtn" class="active" title="Afficher la grille" onclick="toggleGrid()">▦</button><button title="Réinitialiser le repère" onclick="resetView()">⌗</button><button title="Annuler" onclick="undo()">↶</button><button title="Rétablir" onclick="redo()">↷</button><button class="right mobiletoggle" onclick="document.querySelector('.rightside').classList.toggle('open')">☷</button><input id="loadfile" type="file" accept=".json,.geomaths" hidden onchange="loadFile(event)"></div>
<div class="layout"><aside class="side"><div class="sidehead">Construction <span id="count">0 objets</span></div><div class="algebra"><input id="command" placeholder="Saisir f(x)=…, A=(2,3)…" onkeydown="if(event.key==='Enter')command()"><p style="font-size:11px;color:#8994a6">Entre une fonction, par ex. <b>f(x)=x^2</b></p></div><div id="objects" class="objects"><div class="empty">Les objets créés apparaîtront ici.</div></div></aside><main class="stage" id="stage"><svg id="canvas" aria-label="Plan de construction GeoMaths"></svg><div id="hint" class="hint">Outil Déplacer · glisse un point ou déplace le repère</div><div id="toast" class="toast"></div></main><aside class="side rightside"><div class="sidehead">Outils de construction <span>⋯</span></div><div id="toolbox"></div></aside></div>
<div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle">Créer un objet</h2><input id="modalInput" placeholder=""><div class="actions"><button class="plain" onclick="closeModal()">Annuler</button><button class="primary" onclick="submitModal()">Créer</button></div></div></div>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('canvas');let view={cx:0,cy:0,scale:42},axes=true,grid=true,tool='move',objects=[],serial=0,undoStack=[],redoStack=[],pending=[],drag=null,pan=null,modalAction=null;
const catalog=[['POINTS',[['move','↖','Déplacer'],['point','•','Point'],['midpoint','⊙','Milieu'],['intersection','×','Intersection']]],['DROITES',[['segment','／','Segment'],['line','↗','Droite'],['ray','⟶','Demi-droite'],['vector','⇢','Vecteur'],['parallel','∥','Parallèle'],['perpendicular','⊥','Perpendiculaire']]],['CERCLES ET ARCS',[['circle','◯','Cercle'],['circle3','◉','Cercle passant par 3 points']]],['POLYGONES ET ANGLES',[['polygon','⬠','Polygone'],['angle','∠','Angle'],['regular','⬡','Polygone régulier']]],['TRANSFORMATIONS',[['reflect','◐','Symétrie axiale'],['rotate','⟳','Rotation'],['translate','⇥','Translation']]],['FONCTIONS',[['function','ƒ','Tracer une fonction'],['tangent','T','Tangente'],['integral','∫','Intégrale']],]];
function buildTools(){let box=document.getElementById('toolbox');box.innerHTML=catalog.map(([name,items])=>`<section class="panel"><div class="sect" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${name}<span>⌄</span></div><div class="tools">${items.map(([id,icon,label])=>`<button class="tool ${tool===id?'active':''}" title="${label}" aria-label="${label}" onclick="setTool('${id}')">${icon}</button>`).join('')}</div></section>`).join('')}
function setTool(t){tool=t;pending=[];buildTools();let hints={move:'Déplacer · glisse les points ou le repère',point:'Point · clique dans le plan',midpoint:'Milieu · sélectionne deux points',segment:'Segment · sélectionne deux points',line:'Droite · sélectionne deux points',ray:'Demi-droite · sélectionne deux points',vector:'Vecteur · sélectionne deux points',circle:'Cercle · centre puis point du cercle',polygon:'Polygone · clique les sommets puis clique le premier',parallel:'Parallèle · droite puis point',perpendicular:'Perpendiculaire · droite puis point',function:'Fonction · saisis f(x)=… dans le champ à gauche'};document.getElementById('hint').textContent=hints[t]||`Outil ${t} · sélectionne les éléments dans le plan`;if(t==='function')openModal('Tracer une fonction','f(x)=x^2','function')}
function el(tag,attrs={},parent=svg){let n=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}function sx(x){return (x-view.cx)*view.scale+svg.clientWidth/2}function sy(y){return svg.clientHeight/2-(y-view.cy)*view.scale}function wx(x){return (x-svg.clientWidth/2)/view.scale+view.cx}function wy(y){return (svg.clientHeight/2-y)/view.scale+view.cy}function snap(){undoStack.push(JSON.stringify({objects,serial,view,axes,grid}));if(undoStack.length>80)undoStack.shift();redoStack=[]}function add(o){snap();o.id='o'+(++serial);o.visible=true;objects.push(o);draw();listObjects()}
function gridStep(){let raw=100/view.scale,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<2?1:m<5?2:5)*p}function draw(){svg.innerHTML='';let w=svg.clientWidth,h=svg.clientHeight;if(!w||!h)return;let defs=el('defs');let clip=el('clipPath',{id:'clip'} ,defs);el('rect',{x:0,y:0,width:w,height:h},clip);let layer=el('g',{ 'clip-path':'url(#clip)'});let step=gridStep(),minx=wx(0),maxx=wx(w),miny=wy(h),maxy=wy(0);if(grid){for(let x=Math.floor(minx/step)*step;x<=maxx;x+=step)el('line',{x1:sx(x),y1:0,x2:sx(x),y2:h,class:'gridline '+(Math.abs(x/step/5-Math.round(x/step/5))<.001?'major':'')},layer);for(let y=Math.floor(miny/step)*step;y<=maxy;y+=step)el('line',{x1:0,y1:sy(y),x2:w,y2:sy(y),class:'gridline '+(Math.abs(y/step/5-Math.round(y/step/5))<.001?'major':'')},layer)}if(axes){if(miny<=0&&maxy>=0){el('line',{x1:0,y1:sy(0),x2:w,y2:sy(0),class:'axes'},layer);for(let x=Math.ceil(minx/step)*step;x<maxx;x+=step)if(x!==0){el('line',{x1:sx(x),y1:sy(0)-5,x2:sx(x),y2:sy(0)+5,class:'axes'},layer);if(Math.abs(x/step)<20)el('text',{x:sx(x),y:sy(0)+19,'text-anchor':'middle',class:'ticktext'},layer).textContent=fmt(x)}}if(minx<=0&&maxx>=0){el('line',{x1:sx(0),y1:0,x2:sx(0),y2:h,class:'axes'},layer);for(let y=Math.ceil(miny/step)*step;y<maxy;y+=step)if(y!==0){el('line',{x1:sx(0)-5,y1:sy(y),x2:sx(0)+5,y2:sy(y),class:'axes'},layer);if(Math.abs(y/step)<20)el('text',{x:sx(0)-9,y:sy(y)+4,'text-anchor':'end',class:'ticktext'},layer).textContent=fmt(y)}}}
objects.filter(o=>o.visible).forEach(o=>drawObject(layer,o));svg.onpointerdown=pointerDown;svg.onpointermove=pointerMove;svg.onpointerup=()=>{drag=null;pan=null};svg.onwheel=e=>{e.preventDefault();let before=[wx(e.offsetX),wy(e.offsetY)],factor=e.deltaY<0?1.12:.89;view.scale=Math.max(8,Math.min(180,view.scale*factor));view.cx=before[0]-(e.offsetX-w/2)/view.scale;view.cy=before[1]+(e.offsetY-h/2)/view.scale;draw()}}
function fmt(n){return Number(n.toPrecision(4)).toString()}function point(id){return objects.find(o=>o.id===id)}function pos(id){let p=point(id);return p?{x:p.x,y:p.y}:{x:0,y:0}}function drawObject(g,o){let p,a,b;if(o.type==='point'){let x=sx(o.x),y=sy(o.y);el('circle',{cx:x,cy:y,r:5.5,class:'pt',onpointerdown:e=>{e.stopPropagation();if(tool==='move')drag=o.id}},g);el('text',{x:x+9,y:y-8,class:'label'},g).textContent=o.name}
else if(['segment','line','ray','vector','parallel','perpendicular'].includes(o.type)){a=pos(o.a);b=pos(o.b);let dx=b.x-a.x,dy=b.y-a.y;if(o.type==='parallel'||o.type==='perpendicular'){let base=objects.find(v=>v.id===o.line);if(!base)return;let u=pos(base.a),v=pos(base.b),vx=v.x-u.x,vy=v.y-u.y;if(o.type==='perpendicular')[vx,vy]=[-vy,vx];a=pos(o.point);b={x:a.x+vx,y:a.y+vy};dx=b.x-a.x;dy=b.y-a.y}let k=o.type==='segment'?0:o.type==='ray'?-1:3e3;let x1=o.type==='segment'?a.x:a.x-k*dx,y1=o.type==='segment'?a.y:a.y-k*dy,x2=o.type==='segment'?b.x:a.x+k*dx,y2=o.type==='segment'?b.y:a.y+k*dy;el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:'construction'},g);if(o.type==='vector')el('circle',{cx:sx(b.x),cy:sy(b.y),r:2.8,fill:'#386fd4'},g)}
else if(o.type==='circle'){a=pos(o.a);b=pos(o.b);el('circle',{cx:sx(a.x),cy:sy(a.y),r:Math.hypot(a.x-b.x,a.y-b.y)*view.scale,class:'construction'},g)}else if(o.type==='polygon'){let ps=o.points.map(pos);el('polygon',{points:ps.map(p=>`${sx(p.x)},${sy(p.y)}`).join(' '),class:'construction',fill:'#3674ed12'},g)}else if(o.type==='function'){let d='',started=false;for(let px=0;px<svg.clientWidth;px+=2){let x=wx(px),y=evalExpr(o.expr,x);if(!Number.isFinite(y)||Math.abs(y)>1e6){started=false;continue}let py=sy(y);if(!Number.isFinite(py)||py<-1000||py>svg.clientHeight+1000){started=false;continue}d+=(started?'L':'M')+px+' '+py;started=true}el('path',{d,class:'graph'},g);el('text',{x:12,y:25+14*objects.filter(z=>z.type==='function').findIndex(z=>z.id===o.id),class:'label',fill:o.color||'#e45169'},g).textContent=o.name+'(x) = '+o.expr}}
function pointerDown(e){if(e.target.closest('.pt'))return;let x=wx(e.offsetX),y=wy(e.offsetY);if(tool==='move'){pan={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};return}if(tool==='point'){add({type:'point',x,y,name:nextName()});return}if(tool==='function')return;let hit=objects.filter(o=>o.type==='point').sort((p,q)=>(p.x-x)**2+(p.y-y)**2-((q.x-x)**2+(q.y-y)**2))[0];if(!hit||Math.hypot(sx(hit.x)-e.offsetX,sy(hit.y)-e.offsetY)>22){add({type:'point',x,y,name:nextName()});hit=objects.at(-1)}pending.push(hit.id);if(tool==='polygon'){if(pending.length>2&&hit.id===pending[0].id){add({type:'polygon',points:pending.slice(0,-1)});pending=[]}else toast('Continue à cliquer les sommets, puis re-clique le premier.');return}if(['segment','line','ray','vector','circle'].includes(tool)&&pending.length===2){let type=tool;add(type==='circle'?{type,a:pending[0],b:pending[1]}:{type,a:pending[0],b:pending[1]});pending=[]}else if(['parallel','perpendicular'].includes(tool)&&pending.length===1){let ln=objects.filter(o=>['line','segment','ray'].includes(o.type)).at(-1);if(!ln){toast('Crée d’abord une droite ou un segment.');pending=[];return}add({type:tool,line:ln.id,point:pending[0]});pending=[]}else if(tool==='midpoint'&&pending.length===2){let a=pos(pending[0]),b=pos(pending[1]);add({type:'point',x:(a.x+b.x)/2,y:(a.y+b.y)/2,name:nextName()});pending=[]}else if(pending.length===1&&tool!=='midpoint')toast('Sélectionne un deuxième point.')}
function pointerMove(e){if(drag){let p=point(drag),r=svg.getBoundingClientRect();p.x=wx(e.clientX-r.left);p.y=wy(e.clientY-r.top);draw();return}if(pan&&tool==='move'){view.cx=pan.cx-(e.clientX-pan.x)/view.scale;view.cy=pan.cy+(e.clientY-pan.y)/view.scale;draw()}}
function nextName(){return String.fromCharCode(65+objects.filter(o=>o.type==='point').length%26)+(objects.filter(o=>o.type==='point').length>=26?Math.floor(objects.filter(o=>o.type==='point').length/26):'')}
function listObjects(){let root=document.getElementById('objects'),items=objects.slice().reverse();document.getElementById('count').textContent=items.length+' objets';if(!items.length){root.innerHTML='<div class="empty">Les objets créés apparaîtront ici.</div>';return}root.innerHTML=items.map(o=>`<div class="obj"><span class="sym">${o.type==='point'?'•':o.type==='function'?'ƒ':'◇'}</span><span>${o.name||o.type}</span><small>${o.type==='point'?`(${fmt(o.x)}, ${fmt(o.y)})`:o.type==='function'?`f(x)=${o.expr}`:''}</small><button onclick="toggleObj('${o.id}')" title="Afficher/masquer" style="border:0;background:none">${o.visible?'◉':'○'}</button><button onclick="removeObj('${o.id}')" title="Supprimer" style="border:0;background:none">×</button></div>`).join('')}
function toggleObj(id){let o=objects.find(o=>o.id===id);if(o){o.visible=!o.visible;draw();listObjects()}}function removeObj(id){snap();objects=objects.filter(o=>o.id!==id);draw();listObjects()}function evalExpr(expr,x){let s=expr.toLowerCase().replace(/π/g,'pi').replace(/\^/g,'**').replace(/\bpi\b/g,'Math.PI').replace(/\be\b/g,'Math.E').replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|abs|log|ln|exp|floor|ceil|round)\s*\(/g,(_,f)=>`Math.${f==='ln'?'log':f}(`).replace(/\bpow\s*\(/g,'Math.pow(');if(!/^[0-9x+\-*/().,%\sA-Za-z_*]+$/.test(s)||/\b(?:window|document|globalThis|constructor|Function|eval|process|require|fetch|import)\b/i.test(s))return NaN;try{return Function('x','"use strict";return ('+s+')')(x)}catch{return NaN}}
function openModal(title,value,action){document.getElementById('modalTitle').textContent=title;let i=document.getElementById('modalInput');i.value=value;i.placeholder='ex. f(x)=sin(x)';document.getElementById('modal').classList.add('open');modalAction=action;i.focus()}function closeModal(){document.getElementById('modal').classList.remove('open')}function submitModal(){let s=document.getElementById('modalInput').value.trim();if(!s)return;let m=s.match(/^(?:([A-Za-z]\w*)\s*\(\s*x\s*\)\s*=\s*)?(.+)$/);if(!m){toast('Écris une expression en x, ex. f(x)=x^2');return}let expr=m[2].replace(/,/g,'.');if(!Number.isFinite(evalExpr(expr,1))&&!Number.isFinite(evalExpr(expr,2))){toast('Expression non reconnue. Essaie x^2, sin(x), sqrt(x)…');return}let name=m[1]||'f';add({type:'function',expr,name});closeModal();setTool('move')}
function command(){let s=document.getElementById('command').value.trim();document.getElementById('command').value='';if(/\(\s*x\s*\)\s*=/.test(s)){openModal('Tracer une fonction',s,'function');submitModal();return}let m=s.match(/^([A-Za-z]\w*)\s*=\s*\(?\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*\)?$/);if(m){add({type:'point',name:m[1],x:+m[2],y:+m[3]});return}toast('Saisie possible : f(x)=x^2 ou A=(2,3).')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2300)}function toggleAxes(){axes=!axes;document.getElementById('axisBtn').classList.toggle('active',axes);draw()}function toggleGrid(){grid=!grid;document.getElementById('gridBtn').classList.toggle('active',grid);draw()}function resetView(){view={cx:0,cy:0,scale:42};draw()}function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify({objects,serial,view,axes,grid}));restore(undoStack.pop())}function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify({objects,serial,view,axes,grid}));restore(redoStack.pop())}function restore(s){let d=JSON.parse(s);objects=d.objects;serial=d.serial;view=d.view;axes=d.axes;grid=d.grid;draw();listObjects()}function clearFigure(){if(objects.length&&!confirm('Effacer tous les objets de la figure ?'))return;snap();objects=[];draw();listObjects()}function saveFile(){let b=new Blob([JSON.stringify({format:'GeoMaths',version:1,objects,view,axes,grid},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='figure-geomaths.json';a.click();URL.revokeObjectURL(a.href)}function loadFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.format!=='GeoMaths'||!Array.isArray(d.objects))throw 0;snap();objects=d.objects;view=d.view||view;axes=d.axes!==false;grid=d.grid!==false;serial=Math.max(0,...objects.map(o=>+(o.id||'o0').slice(1)));draw();listObjects();toast('Figure ouverte.')}catch{toast('Fichier GeoMaths invalide.')}};r.readAsText(f);e.target.value=''}
window.addEventListener('resize',draw);buildTools();draw();listObjects();
</script></body></html>
