<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les applications de Monsieur Zeghoudi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#1a0f3d;--panel:#261552;--edge:#3d2b80;--input:#140a30;--ink:#fff;--soft:#b9b0e6;--yellow:#f7c948;--pink:#e0559a;--blue:#5b87f5;--green:#4fc58b;--orange:#f08a3c;--dark:#2a1860}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:"Nunito",system-ui,sans-serif;font-weight:700;color:var(--ink);min-height:100vh;overflow-x:hidden;
 background:radial-gradient(900px 600px at 85% -10%,#3b1f86 0%,transparent 60%),radial-gradient(700px 500px at 0% 100%,#2d1470 0%,transparent 60%),var(--bg)}
.sym{position:fixed;inset:0;pointer-events:none;z-index:0}
.sym span{position:absolute;font-family:"Lilita One",sans-serif;color:#fff;opacity:.07;line-height:1}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:36px 24px 64px}
header{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:64px;height:64px;border-radius:50%;background:var(--yellow);color:var(--dark);display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:2rem;box-shadow:0 6px 0 #c99a1c;flex:none}
h1{font-family:"Lilita One","Nunito",sans-serif;font-weight:400;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.05;margin:0;color:var(--yellow);max-width:560px;letter-spacing:.01em}
.tools{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:inherit}
.search{padding:12px 18px;border:2px solid var(--edge);border-radius:999px;background:var(--input);color:var(--ink);min-width:210px;font-weight:700}
.search::placeholder,dialog input::placeholder{color:#7e73b8}
.btn{padding:12px 20px;border:2px solid var(--edge);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer;font-weight:800;transition:transform .12s}
.btn.primary{background:var(--pink);border-color:var(--pink);box-shadow:0 5px 0 #a83b73}
.btn:hover{transform:translateY(-2px)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}
.tile{--c:var(--pink);position:relative;background:#fff;border:5px solid var(--c);border-radius:24px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);transition:transform .15s}
.tile:nth-child(4n+1){--c:var(--pink)}.tile:nth-child(4n+2){--c:var(--blue)}.tile:nth-child(4n+3){--c:var(--green)}.tile:nth-child(4n+4){--c:var(--orange)}
.tile:hover{transform:translateY(-4px) rotate(-.6deg)}
.tile a{display:block;color:inherit;text-decoration:none}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center;font-size:3.4rem;background-size:cover;background-position:center;border-bottom:4px solid var(--c)}
.thumb span{position:absolute;inset:0;display:grid;place-items:center}
.thumb iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.name{padding:14px 16px 16px;font-family:"Lilita One","Nunito",sans-serif;font-weight:400;font-size:1.2rem;color:var(--dark);text-align:center}
.edit-bar{position:absolute;top:8px;right:8px;display:none;gap:6px}
.editing .edit-bar{display:flex}
.editing .tile a{pointer-events:none}
.mini{width:36px;height:36px;border:2px solid var(--dark);border-radius:50%;background:#fff;color:var(--dark);cursor:pointer;font-weight:800}
.empty{border:3px dashed var(--edge);border-radius:24px;padding:40px 24px;background:var(--panel);max-width:520px}
.empty h2{margin:0 0 8px;font-family:"Lilita One",sans-serif;font-weight:400;color:var(--yellow)}
.empty p{color:var(--soft);margin:0 0 18px}
dialog{border:2px solid var(--edge);border-radius:24px;background:var(--panel);color:var(--ink);padding:26px;width:min(450px,92vw)}
dialog::backdrop{background:rgba(10,5,30,.7)}
dialog h2{font-family:"Lilita One",sans-serif;font-weight:400;color:var(--yellow);font-size:1.7rem}
label{display:block;font-weight:800;margin:16px 0 6px}
dialog input[type=text]{width:100%;padding:12px 16px;border:2px solid var(--edge);border-radius:999px;background:var(--input);color:var(--ink)}
dialog input[type=file]{color:var(--soft);max-width:100%}
small{color:var(--soft);display:block;margin-top:6px;font-weight:600}
.row{display:flex;gap:12px;align-items:center}
.row input[type=color]{width:54px;height:44px;border:2px solid var(--edge);border-radius:999px;padding:2px;background:var(--input)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.note{color:var(--soft);margin-top:34px;font-size:.92rem;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sym" aria-hidden="true"><span style="left:4%;top:14%;font-size:90px;transform:rotate(-12deg)">π</span><span style="right:6%;top:8%;font-size:120px;transform:rotate(10deg)">%</span><span style="left:46%;top:46%;font-size:110px;transform:rotate(8deg)">Σ</span><span style="right:4%;top:55%;font-size:90px;transform:rotate(-8deg)">÷</span><span style="left:8%;bottom:8%;font-size:130px;transform:rotate(14deg)">∫</span><span style="right:22%;bottom:6%;font-size:100px;transform:rotate(-14deg)">√</span></div>
<div class="wrap" id="app">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">π</div><h1>Les applications de Monsieur Zeghoudi</h1></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Rechercher…" aria-label="Rechercher une application">
      <button class="btn primary" id="add">Ajouter une application</button>
      <button class="btn" id="toggle" aria-pressed="false">Modifier</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
  <p class="note" id="note"></p>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle" style="margin:0">Nouvelle application</h2>
    <label for="fName">Nom</label>
    <input type="text" id="fName" required maxlength="60">
    <label for="fUrl">Fichier ou adresse</label>
    <input type="text" id="fUrl" required placeholder="ma-page.html">
    <small>Si ce fichier est dans le même dossier que cette page, écrivez simplement son nom.</small>
    <label for="fEmoji">Icône (un emoji)</label>
    <div class="row"><input type="text" id="fEmoji" maxlength="4" style="width:90px" placeholder="📚"><input type="color" id="fColor" value="#ffd966" aria-label="Couleur de fond"></div>
    <label for="fImg">Miniature (capture d’écran, facultatif)</label>
    <input type="file" id="fImg" accept="image/*">
    <div class="actions">
      <button class="btn" type="button" id="cancel">Annuler</button>
      <button class="btn primary" type="submit" id="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var KEY="mes-applications-v1", apps=[], editId=null, imgData=null, editing=false;
  var grid=document.getElementById("grid"), q=document.getElementById("q"), dlg=document.getElementById("dlg");
  var B="https://fatheyze.github.io/";
  var SEED=[
    ["roue-maths","Roue des maths","🎡","#ffd966"],
    ["interro-flash","Interro flash","⚡","#ffb4a2"],
    ["maths-expedition","Maths expédition","🧭","#a8dadc"],
    ["memo-brevet","Mémo brevet","📝","#cdb4db"],
    ["qrcodes","QR codes","🔳","#b5e48c"],
    ["suivi-numerique","Suivi numérique","📊","#9bc4ff"],
    ["rcd","RCD","🎲","#ffc8dd"],
    ["automatismes-maths","Automatismes maths","🧮","#fde4a1"]
  ].map(function(s){return {id:s[0],name:s[1],url:B+s[0]+"/",emoji:s[2],color:s[3],img:null}});
  function load(){
    var raw=null;
    try{raw=localStorage.getItem(KEY)}catch(e){}
    if(raw===null){apps=SEED;return}
    try{apps=JSON.parse(raw)}catch(e){apps=SEED}
  }
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){alert("Impossible d’enregistrer : la miniature est peut-être trop lourde.")}}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function render(){
    var term=q.value.trim().toLowerCase();
    var list=apps.filter(function(a){return a.name.toLowerCase().indexOf(term)>-1});
    document.getElementById("app").classList.toggle("editing",editing);
    if(!apps.length){
      grid.innerHTML='<div class="empty"><h2>Aucune application pour l’instant</h2><p>Ajoutez vos pages HTML : chacune devient une miniature sur laquelle cliquer.</p><button class="btn primary" id="first">Ajouter ma première application</button></div>';
      document.getElementById("first").onclick=function(){openDlg()};
      document.getElementById("note").textContent="";return;
    }
    grid.innerHTML=list.map(function(a){
      var style=a.img?'background-image:url('+a.img+')':'background:'+a.color;
      return '<div class="tile"><a href="'+esc(a.url)+'" target="_blank" rel="noopener"><div class="thumb" style="'+style+'">'+(a.img?'':'<span>'+esc(a.emoji||"📄")+'</span><iframe src="'+esc(a.url)+'" loading="lazy" tabindex="-1" title="Aperçu de '+esc(a.name)+'" sandbox="allow-scripts allow-same-origin"></iframe>')+'</div><div class="name">'+esc(a.name)+'</div></a>'+
        '<div class="edit-bar"><button class="mini" data-e="'+a.id+'" aria-label="Modifier '+esc(a.name)+'">✎</button><button class="mini" data-d="'+a.id+'" aria-label="Supprimer '+esc(a.name)+'">✕</button></div></div>';
    }).join("")||'<p>Aucun résultat.</p>';
    document.getElementById("note").textContent="Aperçus en direct de vos pages. Vos réglages sont enregistrés dans ce navigateur.";
    fit();
  }
  function fit(){
    var ts=grid.querySelectorAll(".thumb");
    for(var i=0;i<ts.length;i++){
      var f=ts[i].querySelector("iframe");
      if(f)f.style.transform="scale("+(ts[i].clientWidth/1280)+")";
    }
  }
  window.addEventListener("resize",fit);
  function openDlg(a){
    editId=a?a.id:null; imgData=a&&a.img?a.img:null;
    document.getElementById("dlgTitle").textContent=a?"Modifier l’application":"Nouvelle application";
    document.getElementById("fName").value=a?a.name:"";
    document.getElementById("fUrl").value=a?a.url:"";
    document.getElementById("fEmoji").value=a?a.emoji:"";
    document.getElementById("fColor").value=a?a.color:"#ffd966";
    document.getElementById("fImg").value="";
    dlg.showModal();
  }
  document.getElementById("add").onclick=function(){openDlg()};
  document.getElementById("cancel").onclick=function(){dlg.close()};
  document.getElementById("toggle").onclick=function(e){editing=!editing;e.target.textContent=editing?"Terminer":"Modifier";e.target.setAttribute("aria-pressed",editing);render()};
  q.oninput=render;
  grid.onclick=function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.e)openDlg(apps.filter(function(a){return a.id===b.dataset.e})[0]);
    if(b.dataset.d&&confirm("Supprimer cette application de la page ?")){apps=apps.filter(function(a){return a.id!==b.dataset.d});persist();render()}
  };
  document.getElementById("fImg").onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var w=480,h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);imgData=c.toDataURL("image/jpeg",.8)};im.src=r.result};
    r.readAsDataURL(f);
  };
  document.getElementById("form").onsubmit=function(){
    var o={id:editId||String(Date.now()),name:document.getElementById("fName").value.trim(),url:document.getElementById("fUrl").value.trim(),
      emoji:document.getElementById("fEmoji").value.trim(),color:document.getElementById("fColor").value,img:imgData};
    if(editId)apps=apps.map(function(a){return a.id===editId?o:a});else apps.push(o);
    persist();render();
  };
  load();render();
})();
</script>
</body>
</html>
